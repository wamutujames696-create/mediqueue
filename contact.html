<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact us | 22 MediQueue</title><link rel="stylesheet" href="styles.css"></head><body class="public-body"><header class="topbar public-topbar"><a class="brand" href="index.html"><span class="brand-mark">22</span><span>MEDI<span class="brand-accent">QUEUE</span><small>SMARTER HOSPITAL FLOW</small></span></a><nav><a href="index.html">Home</a><a href="about.html">About us</a><a href="doctors.html">Our doctors</a><a href="index.html#how">How it works</a></nav><div class="top-actions"><a class="btn btn-primary" href="login.html">Sign in</a></div></header><main class="wrap" style="padding:60px 0"><span class="eyebrow">WE'RE HERE TO HELP</span><h1 style="font:800 48px Manrope">Contact <em style="font-style:normal;color:var(--blue)">MediQueue.</em></h1><p class="hero-lead">Reach the support team or contact a listed care professional directly through WhatsApp.</p><div id="contactCards" class="contact-grid"><p>Loading contacts…</p></div></main><footer class="footer wrap"><span>© 2026 22 MediQueue</span><a href="about.html">About us</a></footer><script>
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('api/admin.php?action=public').then(r=>r.json()).then(d=>{const root=document.getElementById('contactCards');const contacts=d.contacts||[];root.innerHTML=contacts.map(c=>{const phone=String(c.phone).replace(/[^0-9]/g,'');return `<article class="contact-card"><span class="feature-icon mint">✆</span><h3>${safe(c.name)}</h3><p>+${phone}</p><a class="btn btn-primary" target="_blank" rel="noopener" href="https://wa.me/${phone}">WhatsApp message ↗</a></article>`}).join('')||'<p>No contacts have been published yet.</p>'}).catch(()=>document.getElementById('contactCards').textContent='Could not load contacts. Please try again.');
</script></body></html>
