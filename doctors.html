<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our doctors | 22 MediQueue</title><link rel="stylesheet" href="styles.css"></head><body class="public-body"><header class="topbar public-topbar"><a class="brand" href="index.html"><span class="brand-mark">22</span><span>MEDI<span class="brand-accent">QUEUE</span><small>OUR CARE TEAM</small></span></a><nav><a href="index.html">Home</a><a href="about.html">About us</a><a href="contact.html">Contact us</a></nav><div class="top-actions"><a class="btn btn-primary" href="login.html">Book an appointment</a></div></header><main class="wrap" style="padding:55px 0"><span class="eyebrow">MEET YOUR CARE TEAM</span><h1 style="font:800 46px Manrope">Choose your <em style="font-style:normal;color:var(--blue)">doctor.</em></h1><p class="hero-lead">Browse available doctors and select your preferred clinician when requesting an appointment.</p><div id="doctorGrid" class="doctor-grid">Loading doctors…</div></main><footer class="footer wrap"><span>© 2026 22 MediQueue</span><a href="contact.html">Contact us</a></footer><script>
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('api/admin.php?action=public').then(r=>r.json()).then(d=>{const root=document.getElementById('doctorGrid');root.innerHTML=(d.doctors||[]).map(x=>`<article class="doctor-card">${x.photo?`<img src="${safe(x.photo)}" alt="${safe(x.title)} ${safe(x.name)}">`:'<div class="doctor-placeholder">✚</div>'}<div><small>${safe(x.title)}</small><h3>${safe(x.title)} ${safe(x.name)}</h3><p>${safe(x.specialty)}</p><p>${safe(x.department||'MediQueue care team')}</p><button class="btn btn-primary" data-select="${Number(x.id)}" data-name="${safe(x.title)} ${safe(x.name)}">Select doctor →</button>${x.whatsapp?` <a class="btn btn-light" target="_blank" rel="noopener" href="https://wa.me/${String(x.whatsapp).replace(/[^0-9]/g,'')}">WhatsApp</a>`:''}</div></article>`).join('')||'<div class="panel">No doctors have been published yet. Please check again later.</div>';root.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{sessionStorage.setItem('mq_selected_doctor',JSON.stringify({id:b.dataset.select,name:b.dataset.name}));location.href='login.html?intent=appointment'})}).catch(()=>document.getElementById('doctorGrid').textContent='Could not load doctors. Please try again.');
</script></body></html>
